services:
  fake-responses:
    image: python:3.12-slim-bookworm
    command: ["python", "/app/fake_responses.py"]
    volumes:
      - ./tests/e2e/fake_responses.py:/app/fake_responses.py:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health')\""]
      interval: 2s
      timeout: 2s
      retries: 10

  presidio-analyzer:
    image: python:3.12-slim-bookworm
    command: ["python", "/app/fake_presidio.py"]
    environment:
      ROLE: analyzer
    volumes:
      - ./tests/e2e/fake_presidio.py:/app/fake_presidio.py:ro

  presidio-anonymizer:
    image: python:3.12-slim-bookworm
    command: ["python", "/app/fake_presidio.py"]
    environment:
      ROLE: anonymizer
    volumes:
      - ./tests/e2e/fake_presidio.py:/app/fake_presidio.py:ro

  ml-backend:
    environment:
      MODEL_VERSION: e2e-multimodal-responses
      MODEL_ENABLED: "true"
      MODEL_PROVIDER: litellm
      MODEL_BASE_URL: http://fake-responses:4000/v1
      MODEL_API_KEY: e2e-only
      MODEL_NAME: e2e-multimodal
      MODEL_SEND_PII: "false"
      MODEL_SEND_IMAGES: "true"
      PII_FAIL_CLOSED: "true"
    depends_on:
      fake-responses:
        condition: service_healthy
